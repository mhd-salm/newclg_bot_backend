services:
  - type: web
    name: newcollege-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_KEYS
        sync: false
      - key: FLASK_ENV
        value: production
